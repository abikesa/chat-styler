<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Styler</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <div class="chat-container">
    <form action="/render" method="post">
      <textarea name="thread" placeholder="Paste chat here..."></textarea>
      <button type="submit">Style It</button>
    </form>

    {% if messages %}
      <div class="chat-box">
        {% for msg in messages %}
          <div class="chat-bubble {{ msg.side }}">
            <div class="message">
              {{ msg.text | safe }}
              <span class="timestamp">11:11 AM ✅✅</span>
            </div>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  </div>

</body>
</html>
